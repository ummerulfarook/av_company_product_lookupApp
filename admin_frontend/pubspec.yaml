name: admin_frontend
description: "AV & Company Admin Portal - Workforce Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.1
  shared_preferences: ^2.2.3
  mobile_scanner: ^5.2.3
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  go_router: ^14.1.4
  audioplayers: ^6.0.0
  flutter_local_notifications: ^17.2.1
  flutter_background_service: ^5.0.7
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
