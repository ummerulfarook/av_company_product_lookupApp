<div class="flex-1 flex flex-col items-center justify-center space-y-lg">

<div class="relative group">
<div class="absolute -inset-4 bg-white/5 blur-xl rounded-full scale-125 opacity-0 group-hover:opacity-100 transition-opacity duration-700"></div>
<img alt="AV &amp; COMPANY Logo" class="w-32 md:w-40 logo-glow relative z-10 w-48 h-auto object-contain" src="https://lh3.googleusercontent.com/aida/ADBb0uh8CTvSHI_1-5xL4Ew7J-ycSYCb46Rbl2EAWU3AhWrvKJaAa4WwqVqZRdcMcnwBwmOQ_qdNfzXwX0T04Sx2eL-aNI50UTkBZL4pjn6yP9m0eN-nJm-aNtOXefV_VXmd3yPyDOCov9N3siIDOqiYG3A8o8leP_9RDe6ZP_SVF95LPAFV12p2K_hfw_16HkNnsrgoP5hvP2STLjtq8le4Hnj-RXTVr0bZYYfuXVULFQANlsDDyhwIFHTKcsQGm04TGMYTBnj-QcCBLg"/>
</div>

<h1 class="font-h1 text-h1 text-on-primary tracking-tighter uppercase">
                    AV &amp; COMPANY
                </h1>
<div class="flex items-center justify-center space-x-sm">
<div class="h-[1px] w-8 bg-white/30"></div>
<p class="font-body-lg text-body-lg text-white/90 tracking-wide">
                        Smart Retail. Faster Service.
                    </p>
<div class="h-[1px] w-8 bg-white/30"></div>
</div>
</div>
</div>
<!-- Bottom Footer Content -->
<div class="flex flex-col items-center space-y-md w-full max-w-xs">

<div class="w-full h-1 bg-white/10 rounded-full overflow-hidden">
<div class="h-full w-1/3 bg-white/60 rounded-full"></div>
</div>
<!-- Establish Information -->
<div class="flex flex-col items-center space-y-unit opacity-60">
<span class="material-symbols-outlined text-white text-lg" data-icon="diamond">diamond</span>
<p class="font-label text-label text-white uppercase tracking-[0.2em]">
                    Established 1994
                </p>
</div>
</div>
<!-- Navigation Shell Suppression: As per rules, Splash screens suppress TopAppBar and BottomNavBar to prioritize brand focus. -->
</main>

<div class="fixed top-0 left-0 w-full px-6 py-2 flex justify-between items-center z-50 pointer-events-none opacity-40">
