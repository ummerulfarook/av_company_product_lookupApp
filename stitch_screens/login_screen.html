<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .bg-login-gradient {
            background: linear-gradient(135deg, #9e2016 0%, #2e3131 100%);
        }
        input:focus {
            box-shadow: 0 0 15px rgba(158, 32, 22, 0.3);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-login-gradient min-h-screen flex items-center justify-center font-body-lg text-on-surface antialiased p-margin-edge">
<main class="w-full max-w-[430px] flex flex-col items-center">
<!-- Login Card Container -->
<div class="glass-card w-full rounded-[32px] p-xl shadow-[0_20px_50px_rgba(0,0,0,0.3)] relative overflow-hidden">
<!-- Branding Header -->
<header class="flex flex-col items-center mb-xl">
<div class="mb-lg p-unit bg-white rounded-2xl shadow-lg">
<img alt="AV &amp; COMPANY Logo" class="w-20 h-20 object-contain rounded-xl" src="https://lh3.googleusercontent.com/aida/ADBb0uh8CTvSHI_1-5xL4Ew7J-ycSYCb46Rbl2EAWU3AhWrvKJaAa4WwqVqZRdcMcnwBwmOQ_qdNfzXwX0T04Sx2eL-aNI50UTkBZL4pjn6yP9m0eN-nJm-aNtOXefV_VXmd3yPyDOCov9N3siIDOqiYG3A8o8leP_9RDe6ZP_SVF95LPAFV12p2K_hfw_16HkNnsrgoP5hvP2STLjtq8le4Hnj-RXTVr0bZYYfuXVULFQANlsDDyhwIFHTKcsQGm04TGMYTBnj-QcCBLg"/>
</div>
<h1 class="font-h2 text-h2 text-white text-center">AV &amp; COMPANY</h1>
<p class="font-label text-label text-white/70 uppercase tracking-[2px] mt-xs">Workforce Portal</p>
</header>
<!-- Form Section -->
<form class="space-y-lg" onsubmit="return false;">
<!-- Username Field -->
<div class="space-y-xs">
<label class="font-label text-label text-white/80 block px-unit">Employee Username</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-white/50" data-icon="person">person</span>
<input class="w-full bg-white/10 border-0 border-b-2 border-white/20 text-white placeholder:text-white/30 pl-[48px] pr-md py-md focus:ring-0 focus:border-primary transition-all font-body-sm rounded-t-lg" placeholder="e.g. av_staff_01" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<label class="font-label text-label text-white/80 block px-unit">Secure Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-white/50" data-icon="lock">lock</span>
<input class="w-full bg-white/10 border-0 border-b-2 border-white/20 text-white placeholder:text-white/30 pl-[48px] pr-md py-md focus:ring-0 focus:border-primary transition-all font-body-sm rounded-t-lg" placeholder="••••••••" type="password"/>
<button class="absolute right-md text-white/50 hover:text-white transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Footer Actions -->
<div class="flex items-center justify-between px-unit pb-sm">
<label class="flex items-center space-x-sm cursor-pointer group">
<input class="rounded-sm border-white/20 bg-white/10 text-primary focus:ring-primary focus:ring-offset-0" type="checkbox"/>
<span class="font-body-sm text-white/70 group-hover:text-white transition-colors">Remember me</span>
</label>
<a class="font-body-sm text-white/70 hover:text-white underline decoration-white/20 transition-colors" href="#">Forgot Access?</a>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-button text-button py-lg rounded-xl flex items-center justify-center space-x-md shadow-[0_8px_20px_rgba(158,32,22,0.4)] active:scale-[0.98] transition-all" type="submit">
<span>Login to Workspace</span>
<svg class="animate-spin h-5 w-5 text-white" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
</button>
</form>
<!-- Decorative Accents -->
<div class="mt-xl text-center">
<p class="font-label text-label text-white/40">Secure Internal Access Only © 2024</p>
</div>
</div>
<!-- Biometric / Secondary Option -->
<button class="mt-xl flex items-center space-x-sm text-white/60 hover:text-white transition-all bg-white/5 px-xl py-md rounded-full border border-white/10 backdrop-blur-md">
<span class="material-symbols-outlined" data-icon="fingerprint">fingerprint</span>
<span class="font-body-sm">Sign in with Biometrics</span>
</button>
</main>
<!-- Support Help FAB -->
<div class="fixed bottom-margin-edge right-margin-edge">
<button class="w-14 h-14 bg-white/10 hover:bg-white/20 backdrop-blur-xl border border-white/20 rounded-full flex items-center justify-center shadow-lg transition-transform active:scale-90">
<span class="material-symbols-outlined text-white" data-icon="help_center">help_center</span>
</button>
</div>
</body></html>
